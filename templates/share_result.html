```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Share Prediction</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e3a8a,
                    #312e81
                );

            color: white;
        }

        .share-card {

            width: 90%;
            max-width: 650px;

            padding: 35px;

            border-radius: 20px;

            background: rgba(255, 255, 255, 0.10);

            border: 1px solid rgba(255, 255, 255, 0.20);

            backdrop-filter: blur(15px);

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.35);

            text-align: center;
        }

        .icon {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .success {
            color: #86efac;
            font-size: 18px;
            margin-bottom: 25px;
        }

        .prediction-box {

            margin: 20px 0;

            padding: 20px;

            border-radius: 15px;

            background: rgba(0, 0, 0, 0.20);

            text-align: left;
        }

        .prediction-box p {
            margin: 10px 0;
            line-height: 1.6;
        }

        .share-url {

            display: flex;

            gap: 10px;

            margin-top: 20px;
        }

        .share-url input {

            flex: 1;

            padding: 13px;

            border: none;

            border-radius: 10px;

            font-size: 14px;

            outline: none;
        }

        button,
        .home-btn {

            border: none;

            padding: 13px 20px;

            border-radius: 10px;

            cursor: pointer;

            font-size: 15px;

            font-weight: bold;

            text-decoration: none;
        }

        button {
            background: #22c55e;
            color: white;
        }

        button:hover {
            background: #16a34a;
        }

        .home-btn {

            display: inline-block;

            margin-top: 25px;

            background: #3b82f6;

            color: white;
        }

        .home-btn:hover {
            background: #2563eb;
        }

    </style>

</head>


<body>

    <div class="share-card">

        <div class="icon">
            🔗
        </div>

        <h1>
            Prediction Shared Successfully
        </h1>

        <div class="success">
            Your sentiment prediction has been shared.
        </div>


        <div class="prediction-box">

            <p>
                <strong>Text:</strong>
                {{ shared_chat.text }}
            </p>

            <p>
                <strong>Prediction:</strong>
                {{ shared_chat.prediction }}
            </p>

            <p>
                <strong>Confidence:</strong>
                {{ "%.2f"|format(shared_chat.confidence) }}%
            </p>

        </div>


        <h3>
            Share this link
        </h3>


        <div class="share-url">

            <input
                type="text"
                id="shareLink"
                value="{{ share_url }}"
                readonly
            >

            <button
                type="button"
                onclick="copyShareLink()"
            >
                Copy
            </button>

        </div>


        <a
            href="{{ share_url }}"
            target="_blank"
            class="home-btn"
        >
            Open Shared Prediction
        </a>


        <br>


        <a
            href="{{ url_for('home') }}"
            class="home-btn"
        >
            Back to Home
        </a>

    </div>


    <script>

        function copyShareLink() {

            const input =
                document.getElementById("shareLink");

            input.select();

            input.setSelectionRange(
                0,
                99999
            );

            navigator.clipboard.writeText(
                input.value
            ).then(function () {

                alert(
                    "Share link copied successfully!"
                );

            }).catch(function () {

                alert(
                    "Unable to copy link. Please copy it manually."
                );

            });

        }

    </script>

</body>

</html>
